<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;700&display=swap');
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',sans-serif;background:#0f172a;margin:0;padding:0;height:100vh;overflow:hidden;color:#f8fafc;display:flex;flex-direction:column}

/* File bar */
.file-bar{padding:8px 14px;border-bottom:1px solid #334155;background:#1e293b;display:flex;align-items:center;gap:6px;font-size:12px;color:#94a3b8;flex-shrink:0}
.file-bar svg{width:14px;height:14px;opacity:.5;flex-shrink:0}
.file-bar .fname{color:#93c5fd;font-weight:500}

/* Session info */
.session-info{display:flex;align-items:center;gap:6px;padding:0 14px;border-bottom:1px solid #334155;background:#1e293b;flex-shrink:0;opacity:0;transform:translateY(-8px);transition:all .3s ease;height:0;overflow:hidden;border-top:none}
.session-info.visible{opacity:1;transform:translateY(0);height:36px;padding:6px 14px}
.session-badge{background:rgba(30,58,138,.4);color:#93c5fd;border:1px solid rgba(30,64,175,.5);font-size:11px;font-weight:600;padding:2px 10px;border-radius:6px;display:flex;align-items:center;gap:5px}
.session-badge svg{width:12px;height:12px}

/* Chat body */
.chat-body{flex:1;padding:16px;overflow-y:auto;display:flex;flex-direction:column;gap:16px;scroll-behavior:smooth}
.chat-body::-webkit-scrollbar{display:none}
.chat-body{-ms-overflow-style:none;scrollbar-width:none}

/* Messages */
.message-row{display:flex;width:100%;animation:fadeIn .3s ease-out}
.message-row.user{justify-content:flex-end}
.message-row.bot{justify-content:flex-start;flex-direction:column;align-items:flex-start;max-width:85%}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}

.bubble{padding:12px 16px;border-radius:18px;font-size:13.5px;line-height:1.6;max-width:80%;word-wrap:break-word;white-space:pre-wrap}
.bubble.user{background:#3b82f6;color:#fff;border-bottom-left-radius:4px;box-shadow:0 4px 6px -1px rgba(0,0,0,.2)}
.bubble.bot{background:#334155;color:#f8fafc;border-bottom-right-radius:4px;box-shadow:0 2px 4px rgba(0,0,0,.1)}

/* Thinking bubble */
.thinking-bubble{padding:6px 12px!important;display:inline-flex!important;align-items:center!important;width:fit-content!important;min-height:unset!important;line-height:1!important}
.thinking-indicator{display:flex;align-items:center;gap:5px;height:20px}
.dot{width:7px;height:7px;background:#94a3b8;border-radius:50%;animation:bounce 1.4s infinite ease-in-out both}
.dot:nth-child(1){animation-delay:-.32s}
.dot:nth-child(2){animation-delay:-.16s}
@keyframes bounce{0%,80%,100%{transform:scale(0)}40%{transform:scale(1)}}

/* Reasoning */
.reasoning-container{margin-bottom:8px;width:100%;border-radius:12px;overflow:hidden;border:1px solid #334155;background:#0f172a;display:none}
.reasoning-header{padding:8px 12px;display:flex;align-items:center;justify-content:space-between;cursor:pointer;font-size:12px;color:#94a3b8;background:#1e293b;transition:background .2s}
.reasoning-header:hover{background:#334155}
.reasoning-header svg{width:12px;height:12px;transition:transform .3s ease}
.reasoning-header.expanded svg{transform:rotate(180deg)}
.reasoning-content{max-height:0;overflow:hidden;transition:max-height .4s ease-out,padding .4s ease-out;font-size:12px;color:#cbd5e1;line-height:1.5;white-space:pre-wrap}
.reasoning-content.expanded{max-height:400px;padding:12px;border-top:1px solid #334155;overflow-y:auto}

/* Activity log */
.activity-log{margin:4px 0 0 0;font-size:11px;color:#64748b;font-family:'SF Mono','Fira Code',monospace;line-height:1.5}
.activity-item{opacity:.6;animation:actIn .15s ease-out}
.activity-item:last-child{opacity:1}
.activity-item::before{content:'* ';color:#a78bfa;opacity:.6}
@keyframes actIn{from{opacity:0;transform:translateX(-4px)}to{opacity:.6;transform:none}}

/* Input */
.input-area{padding:10px 14px 12px;background:#1e293b;border-top:1px solid #334155;flex-shrink:0}
.input-wrapper{position:relative;display:flex;align-items:center;background:#0f172a;border:1px solid #334155;border-radius:24px;padding:6px 12px;transition:border-color .2s,box-shadow .2s}
.input-wrapper:focus-within{border-color:#3b82f6;box-shadow:0 0 0 3px rgba(59,130,246,.2);background:#1e293b}
.chat-input{flex:1;border:none;background:transparent;padding:6px 8px;font-size:13px;outline:none;resize:none;max-height:80px;min-height:36px;font-family:inherit;color:#f8fafc}
.chat-input::placeholder{color:#64748b}
.send-btn{background:#3b82f6;color:#fff;border:none;border-radius:50%;width:34px;height:34px;display:flex;justify-content:center;align-items:center;cursor:pointer;transition:background .2s,transform .1s;flex-shrink:0}
.send-btn:hover{background:#2563eb}
.send-btn:active{transform:scale(.95)}
.send-btn.stop-mode{background:#ef4444;border-radius:10px}
.send-btn.stop-mode:hover{background:#dc2626}
.input-actions{display:flex;align-items:center;gap:4px;margin-left:6px;flex-shrink:0}
.icon-btn{background:none;border:none;color:#64748b;cursor:pointer;padding:6px;border-radius:8px;transition:all .15s;display:flex;align-items:center;justify-content:center}
.icon-btn:hover{color:#a78bfa;background:rgba(167,139,250,.1)}
.icon-btn svg{width:16px;height:16px}

/* Status */
.status-bar{padding:4px 14px;border-top:1px solid #334155;background:#1e293b;flex-shrink:0;font-size:11px;color:#64748b;display:flex;align-items:center;gap:6px}
.status-dot{width:6px;height:6px;border-radius:50%;background:#64748b;transition:all .2s}
.status-dot.ready{background:#22c55e;box-shadow:0 0 8px rgba(34,197,94,.3)}
.status-dot.busy{background:#f59e0b;box-shadow:0 0 8px rgba(245,158,11,.3);animation:pulse 1.5s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
</style>
</head>
<body>

<div class="file-bar">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
  <span id="fileCtx">No file open</span>
</div>

<div class="session-info" id="session-info">
  <div class="session-badge">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
    <span id="sessionId">ses_...</span>
  </div>
  <button class="icon-btn" id="clearBtn" title="Clear Chat" style="margin-left:auto">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
  </button>
</div>

<div class="chat-body" id="chat-body">
  <div class="message-row bot">
    <div class="bubble bot">Hello! How can I help you?</div>
  </div>
</div>

<div class="input-area">
  <div class="input-wrapper">
    <textarea id="chatInput" class="chat-input" placeholder="Type your message..." rows="1"></textarea>
    <div class="input-actions">
      <button class="icon-btn" id="summarizeBtn" title="Summarize">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>
      </button>
      <button class="send-btn" id="sendBtn" title="Send">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
      </button>
    </div>
  </div>
</div>

<div class="status-bar">
  <div class="status-dot ready" id="statusDot"></div>
  <span id="statusText">Ready</span>
</div>

<script>
const chatBody = document.getElementById('chat-body');
const chatInput = document.getElementById('chatInput');
const sendBtn = document.getElementById('sendBtn');
const summarizeBtn = document.getElementById('summarizeBtn');
const clearBtn = document.getElementById('clearBtn');
const statusDot = document.getElementById('statusDot');
const statusText = document.getElementById('statusText');
const sessionInfo = document.getElementById('session-info');
const sessionIdEl = document.getElementById('sessionId');

let isProcessing = false;
let currentBotRow = null;
let finishTimeout = null;

// Auto-resize textarea
chatInput.addEventListener('input', function() {
  this.style.height = 'auto';
  this.style.height = this.scrollHeight + 'px';
  if (!isProcessing) sendBtn.disabled = this.value.trim() === '';
});

chatInput.addEventListener('keydown', function(e) {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    if (!isProcessing && this.value.trim()) send();
  }
});

sendBtn.addEventListener('click', () => {
  if (isProcessing) {
    window.parent.postMessage({ type: 'stop' }, '*');
  } else {
    send();
  }
});

summarizeBtn.addEventListener('click', () => {
  if (isProcessing) return;
  window.parent.postMessage({ type: 'summarize' }, '*');
});

clearBtn.addEventListener('click', () => {
  window.parent.postMessage({ type: 'clear' }, '*');
});

function send() {
  const text = chatInput.value.trim();
  if (!text || isProcessing) return;
  // Don't append here — plugin will push userMessage back
  chatInput.value = '';
  chatInput.style.height = 'auto';
  setProcessing(true);
  window.parent.postMessage({ type: 'chat', text }, '*');
}

function setProcessing(v) {
  isProcessing = v;
  statusDot.className = 'status-dot ' + (v ? 'busy' : 'ready');
  statusText.textContent = v ? 'Processing...' : 'Ready';
  if (v) {
    sendBtn.innerHTML = '<svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="4" width="4" height="16" rx="1"/><rect x="14" y="4" width="4" height="16" rx="1"/></svg>';
    sendBtn.classList.add('stop-mode');
    sendBtn.disabled = false;
  } else {
    sendBtn.innerHTML = '<svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>';
    sendBtn.classList.remove('stop-mode');
    sendBtn.disabled = chatInput.value.trim() === '';
  }
}

function appendUserMessage(text) {
  const row = document.createElement('div');
  row.className = 'message-row user';
  const bubble = document.createElement('div');
  bubble.className = 'bubble user';
  bubble.textContent = text;
  row.appendChild(bubble);
  chatBody.appendChild(row);
  scrollToBottom();
}

function createBotContainer() {
  const row = document.createElement('div');
  row.className = 'message-row bot';

  const reasoningContainer = document.createElement('div');
  reasoningContainer.className = 'reasoning-container';

  const reasoningHeader = document.createElement('div');
  reasoningHeader.className = 'reasoning-header';
  reasoningHeader.innerHTML = '<span style="display:flex;align-items:center;gap:6px"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#a78bfa" stroke-width="2"><path d="M12 2a7 7 0 0 1 7 7c0 2.38-1.19 4.47-3 5.74V17a2 2 0 0 1-2 2h-4a2 2 0 0 1-2-2v-2.26C6.19 13.47 5 11.38 5 9a7 7 0 0 1 7-7z"/><path d="M10 21v2a2 2 0 0 0 4 0v-2"/></svg> Thinking</span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>';

  const reasoningContent = document.createElement('div');
  reasoningContent.className = 'reasoning-content';

  reasoningHeader.addEventListener('click', () => {
    reasoningHeader.classList.toggle('expanded');
    reasoningContent.classList.toggle('expanded');
    setTimeout(scrollToBottom, 300);
  });

  reasoningContainer.appendChild(reasoningHeader);
  reasoningContainer.appendChild(reasoningContent);

  const bubble = document.createElement('div');
  bubble.className = 'bubble bot';
  bubble.style.display = 'none';

  row.appendChild(reasoningContainer);
  row.appendChild(bubble);
  chatBody.appendChild(row);

  currentBotRow = { row, reasoningContainer, reasoningContent, bubble };
  scrollToBottom();
}

function showThinking() {
  if (!currentBotRow) return;
  if (document.getElementById('current-thinking')) return; // already showing
  const d = document.createElement('div');
  d.className = 'bubble bot thinking-bubble';
  d.id = 'current-thinking';
  d.innerHTML = '<div class="thinking-indicator"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>';
  currentBotRow.row.appendChild(d);
  scrollToBottom();
}

function removeThinking() {
  const d = document.getElementById('current-thinking');
  if (d) d.remove();
}

function showActivity(tools) {
  if (!currentBotRow) return;
  let logEl = currentBotRow.row.querySelector('.activity-log');
  if (!logEl) {
    logEl = document.createElement('div');
    logEl.className = 'activity-log';
    currentBotRow.row.appendChild(logEl);
  }
  logEl.innerHTML = tools.map(t => '<div class="activity-item">' + esc(t) + '</div>').join('');
  scrollToBottom();
}

function clearActivity() {
  if (!currentBotRow) return;
  const log = currentBotRow.row.querySelector('.activity-log');
  if (log) log.remove();
}

function appendReasoning(text) {
  if (!currentBotRow) return;
  currentBotRow.reasoningContainer.style.display = 'block';
  currentBotRow.reasoningContent.textContent = text;
  scrollToBottom();
}

function appendAnswer(text) {
  if (!currentBotRow) return;
  removeThinking();
  clearActivity();
  currentBotRow.bubble.style.display = 'block';
  currentBotRow.bubble.textContent = text;
  scrollToBottom();
}

function finalize() {
  removeThinking();
  clearActivity();
  setProcessing(false);
  currentBotRow = null;
  if (finishTimeout) { clearTimeout(finishTimeout); finishTimeout = null; }
}

function scrollToBottom() { chatBody.scrollTop = chatBody.scrollHeight; }
function esc(s) { return s ? s.replace(/&/g,'&amp;').replace(/</g,'&lt;') : ''; }

// ─── Receive state from plugin ────────────────────────────────────
let activityLog = [];

window.addEventListener('message', event => {
  const d = event.data;
  if (!d || d.type !== 'state-update') return;
  const s = d.state;
  if (!s) return;

  // File context
  console.log('[mimo-chatbot] File:', s.fileName);
  console.log('[mimo-chatb	ot] File:', s.dirPath);
  //console.log('[mimo-chatbot] File:', s.dirPath);
  
  
  if (s.fileName !== undefined) {
    const fc = document.getElementById('fileCtx');
    if (s.fileName && s.fileName !== 'null') {
      fc.innerHTML = '<span class="fname">' + esc(s.fileName) + '</span> — ' + esc(s.dirPath || '');
    } else {
      fc.textContent = 'No file open';
    }
  }

  // Session ID
  if (s.sessionId) {
    sessionIdEl.textContent = s.sessionId.substring(0, 18) + '...';
    sessionInfo.classList.add('visible');
  }

  // User message FIRST — so it appears before bot container
  if (s.userMessage) {
    appendUserMessage(s.userMessage.content);
  }

  // Step start — show thinking dots (only if no container yet)
  if (s.stepStart) {
    if (!currentBotRow) createBotContainer();
    showThinking();
    activityLog = [];
  }

  // Activity (tool calls)
  if (s.activityUpdate) {
    activityLog = s.activityUpdate;
    showActivity(activityLog);
  }

  // Thinking / reasoning
  if (s.thinkingUpdate !== undefined) {
    if (!currentBotRow) createBotContainer();
    appendReasoning(s.thinkingUpdate);
  }

  // Streaming answer text
  if (s.textUpdate !== undefined) {
    if (!currentBotRow) createBotContainer();
    removeThinking();
    clearActivity();
    currentBotRow.bubble.style.display = 'block';
    currentBotRow.bubble.textContent = s.textUpdate;
    scrollToBottom();
  }

  // Assistant answer (final)
  if (s.assistantMessage) {
    appendAnswer(s.assistantMessage.content);
    // Finalize after showing answer
    if (finishTimeout) clearTimeout(finishTimeout);
    finishTimeout = setTimeout(finalize, 500);
  }

  // Busy state
  if (s.isProcessing !== undefined) {
    setProcessing(s.isProcessing);
  }

  // Clear
  if (s.clear) {
    chatBody.innerHTML = '<div class="message-row bot"><div class="bubble bot">Hello! How can I help you?</div></div>';
    sessionInfo.classList.remove('visible');
    sessionIdEl.textContent = 'ses_...';
    finalize();
  }
});

chatInput.focus();
</script>
</body>
</html>
